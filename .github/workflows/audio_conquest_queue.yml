name: Audio Conquest Queue (warm-polling)

# Self-sustaining queue worker for the free-path extraction pipeline.
#
# Unlike the per-account batch conquest workflows (which range-iterate
# video_intelligence by offset), this one polls voyo_upload_queue and
# claims pending rows atomically via claim_upload_queue(). Runs for
# ~5h per dispatch, then the scheduled cron re-triggers — which means
# there are always ≥3 workers draining the queue.
#
# Dynamic insert flow:
#   PWA searches for track not in R2
#   → UPSERT into voyo_upload_queue (status='pending')
#   → a worker here claims it within 2-3s
#   → yt-dlp + opus transcode + R2 upload (~6-12s)
#   → row marked status='done'
#   → PWA realtime subscription fires → OYO plays it
#
# To run more accounts in parallel, duplicate this file with a different
# cookie blob and a different worker_id prefix. Each account = 3 workers.

on:
  workflow_dispatch: {}
  schedule:
    # Every 4 hours — overlaps the 5h worker run so there's always a
    # live worker. SKIP LOCKED means concurrent workers don't race.
    - cron: '0 */4 * * *'

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # leave headroom under the 6h GitHub cap
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2]
    steps:
      # Setup: lean install. ubuntu-latest already ships ffmpeg, so we skip
      # apt (-30s) and the yt-dlp binary download (-10s). pip install yt-dlp
      # with the Python cache makes subsequent runs ~5s. Cookies are pulled
      # from the VPS cookie bridge (/voyo/cookies) at job start — fresh
      # every run, no more stale baked-in blobs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
      - name: Start bgutil PoT server
        run: |
          docker run -d --name bgutil --network host \
            brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4416/ping > /dev/null; then
              echo "bgutil ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::bgutil didn't start"
          docker logs bgutil || true
          exit 1

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp yt-dlp-ejs boto3 requests bgutil-ytdlp-pot-provider

      - name: Fetch fresh cookies from VPS bridge
        env:
          VOYO_COOKIES_URL: ${{ secrets.VOYO_COOKIES_URL }}
          VOYO_COOKIES_KEY: ${{ secrets.VOYO_COOKIES_KEY }}
        run: |
          curl -fsS -k \
            -H "X-Voyo-Key: $VOYO_COOKIES_KEY" \
            "$VOYO_COOKIES_URL" \
            -o /tmp/cookies.txt
          LINES=$(wc -l < /tmp/cookies.txt)
          if [ "$LINES" -lt 5 ]; then
            echo "::error::cookie bridge returned too-short file ($LINES lines)"
            exit 1
          fi
          echo "cookies: $LINES lines fetched"

      - name: Write queue worker
        run: |
          cat > worker.py <<'SCRIPT'
          import os, subprocess, time, random, signal, sys
          from pathlib import Path
          import boto3
          from botocore.config import Config
          import requests

          SUPABASE_URL  = "https://anmgyxhnyhbyxzpjhxgx.supabase.co"
          SUPABASE_KEY  = os.environ['SUPABASE_KEY']
          R2_ACCOUNT_ID = os.environ['R2_ACCOUNT_ID']
          R2_ACCESS_KEY = os.environ['R2_ACCESS_KEY']
          R2_SECRET_KEY = os.environ['R2_SECRET_KEY']
          R2_BUCKET     = 'voyo-audio'
          WORKER        = os.environ['WORKER']
          RUN_ID        = os.environ.get('GITHUB_RUN_ID', 'local')
          WORKER_ID     = f"queue-{RUN_ID}-w{WORKER}"

          # Run budget: 5h 10m. Workflow timeout is 5h 30m, buffer for cleanup.
          BUDGET_SEC   = 5 * 3600 + 10 * 60
          POLL_IDLE_SEC = 3
          BATCH_SIZE   = 5

          TEMP_DIR = Path("/tmp/voyo-audio")
          TEMP_DIR.mkdir(exist_ok=True)

          r2 = boto3.client('s3',
              endpoint_url=f'https://{R2_ACCOUNT_ID}.r2.cloudflarestorage.com',
              aws_access_key_id=R2_ACCESS_KEY,
              aws_secret_access_key=R2_SECRET_KEY,
              config=Config(retries={'max_attempts': 3}))

          HEADERS = {
              'apikey':         SUPABASE_KEY,
              'Authorization':  f'Bearer {SUPABASE_KEY}',
              'Content-Type':   'application/json',
          }

          def log(msg):
              print(f"[{WORKER_ID}] {msg}", flush=True)

          def claim_batch():
              """Atomic claim via SECURITY DEFINER RPC. Returns up to BATCH_SIZE rows."""
              url = f"{SUPABASE_URL}/rest/v1/rpc/claim_upload_queue"
              body = {'p_worker_id': WORKER_ID, 'p_batch_size': BATCH_SIZE}
              r = requests.post(url, json=body, headers=HEADERS, timeout=10)
              if r.status_code != 200:
                  log(f"claim failed: {r.status_code} {r.text[:200]}")
                  return []
              return r.json()

          def mark_done(row_id):
              url = f"{SUPABASE_URL}/rest/v1/voyo_upload_queue?id=eq.{row_id}"
              body = {'status': 'done', 'completed_at': 'now()'}
              requests.patch(url, json=body, headers=HEADERS, timeout=10)

          def mark_failed(row_id, error_msg):
              # Append error, increment failure count, set back to pending for retry
              url  = f"{SUPABASE_URL}/rest/v1/voyo_upload_queue?id=eq.{row_id}"
              # Read current count first (only 1 round-trip in practice)
              cur  = requests.get(f"{url}&select=failure_count", headers=HEADERS, timeout=10)
              count = (cur.json()[0]['failure_count'] if cur.status_code == 200 and cur.json() else 0) + 1
              new_status = 'failed' if count >= 3 else 'pending'
              body = {
                  'status':         new_status,
                  'failure_count':  count,
                  'last_error':     error_msg[:500],
                  'claimed_at':     None,
                  'claimed_by_worker': None,
              }
              requests.patch(url, json=body, headers=HEADERS, timeout=10)

          def requeue_stale():
              """Housekeeping — unclaim rows stuck in processing > 10 min."""
              url = f"{SUPABASE_URL}/rest/v1/rpc/requeue_stale_claims"
              try:
                  r = requests.post(url, json={}, headers=HEADERS, timeout=10)
                  n = r.json() if r.status_code == 200 else 0
                  if n: log(f"housekeeping: requeued {n} stale rows")
              except Exception as e:
                  log(f"housekeeping error: {e}")

          def extract_and_upload(yt_id):
              out = TEMP_DIR / f"{yt_id}.opus"
              cmd = ["yt-dlp", "-x", "--audio-format", "opus", "--audio-quality", "5",
                     "-o", str(TEMP_DIR / f"{yt_id}.%(ext)s"),
                     "--no-playlist",
                     "--cookies", "/tmp/cookies.txt",
                     "--retries", "2", "--socket-timeout", "30",
                     f"https://www.youtube.com/watch?v={yt_id}"]
              result = subprocess.run(cmd, capture_output=True, timeout=120, text=True)
              if not out.exists():
                  webm = TEMP_DIR / f"{yt_id}.webm"
                  if webm.exists(): webm.rename(out)
              if not out.exists():
                  stderr_tail = (result.stderr or '')[-300:]
                  raise RuntimeError(f"yt-dlp exit={result.returncode}: {stderr_tail}")
              r2.upload_file(str(out), R2_BUCKET, f"128/{yt_id}.opus")
              out.unlink(missing_ok=True)

          # Graceful shutdown if runner kills us near the timeout
          _running = True
          def _term(_s, _f):
              global _running
              log("SIGTERM received — finishing current track then exiting")
              _running = False
          signal.signal(signal.SIGTERM, _term)
          signal.signal(signal.SIGINT,  _term)

          def main():
              start = time.time()
              processed = 0
              failed    = 0
              last_housekeep = 0
              log(f"starting — budget {BUDGET_SEC}s")

              while _running and (time.time() - start) < BUDGET_SEC:
                  # Occasional housekeeping (every ~5 min)
                  if time.time() - last_housekeep > 300:
                      requeue_stale()
                      last_housekeep = time.time()

                  batch = claim_batch()
                  if not batch:
                      time.sleep(POLL_IDLE_SEC)
                      continue

                  for row in batch:
                      yt_id = row['youtube_id']
                      row_id = row['id']
                      t0 = time.time()
                      try:
                          extract_and_upload(yt_id)
                          mark_done(row_id)
                          processed += 1
                          log(f"✓ {yt_id} in {time.time()-t0:.1f}s (total {processed})")
                      except Exception as e:
                          mark_failed(row_id, str(e))
                          failed += 1
                          log(f"✗ {yt_id} in {time.time()-t0:.1f}s: {str(e)[:150]}")
                      # Politeness between tracks
                      time.sleep(random.uniform(0.1, 0.3))

              log(f"DONE — processed={processed} failed={failed} runtime={int(time.time()-start)}s")

          if __name__ == "__main__":
              main()
          SCRIPT

      - name: Run queue worker
        env:
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          VOYO_PROXY:    ${{ secrets.VOYO_PROXY }}
          WORKER:        ${{ matrix.worker }}
        run: python worker.py
